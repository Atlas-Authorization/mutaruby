name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit tests
        run: bundle exec rake test:unit
        timeout-minutes: 10
        env:
          TESTOPTS: -v
          TEST_WATCHDOG: '120'
      - name: End-to-end tests
        run: bundle exec rake test:e2e
      # The fixture's `i += 1` -> `i -= 1` mutant loops forever: the run only finishes if the timeout stops the
      # whole process tree (taskkill /T on Windows, the process group elsewhere).
      - name: Fixture run with a timeout mutant
        shell: bash
        run: |
          bundle exec ruby exe/mutaruby -C test/fixtures/calc -t "ruby test/test_calc.rb" --operators op-assign \
            --timeout 5 -j 2 -q --json fixture.json
          ruby -rjson -e 'c = JSON.parse(File.read("fixture.json"))["counts"]; p c; exit(c["timeout"] >= 1 ? 0 : 1)'
      - name: Fixture run with coverage-based selection (Minitest and RSpec)
        shell: bash
        run: |
          for cmd in "ruby test/test_calc.rb" "ruby -S rspec"; do
            bundle exec ruby exe/mutaruby -C test/fixtures/calc -t "$cmd" --coverage --timeout 10 -j 2 -q --json cov.json
            ruby -rjson -e 'r = JSON.parse(File.read("cov.json")); p [r["coverage"], r["counts"]]; exit(r["coverage"] && r["counts"]["survived"] == 2 ? 0 : 1)'
          done
      - name: Build the gem
        run: gem build mutaruby.gemspec
